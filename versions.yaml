# Machine-readable version manifest for openadr-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles (and adapters/cbsigma/go.mod) are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.8.2"
contract_version: "1.5"        # docs/CONTAINER_CONTRACT.md; documents carry schemaVersion "1.0", the compatible line
fixture_schema: "1.1"          # fixtures/schema/openadr-fixture.schema.json

protocol:
  name: "OpenADR 3"
  versions: ["3.1.0", "3.0.1"]   # 3.0.1: the openleadr301 server and the baseline-301 fixture
  default_port: 8080           # inside the images; plain HTTP, for test networks only

# The OpenAPI document the conformance suite asserts against (conformance/spec).
specification:
  "3.1.0":
    document: conformance/spec/3.1.0/openadr3.yaml
    sha256: "135bc74af2f733338b55afa95df3cb3a1185867e8e41a7d16cdb2dbfaeb3b475"
    source: "https://github.com/grid-coordination/openadr3-specification"
    source_revision: "ca9696d324b8ab6a41b34aaefa48fc98c0a775f5"
    upstream_revision: "ddd2cc58589bdc31ba1dd19fbdf90ed7e10b31dc"   # oadr3-org/specification, document 20250807-X

implementations:
  openleadr:
    priority: P0
    status: published            # ghcr.io/otfabric/openadr-interop-openleadr, digests in each release's manifest.json
    upstream: "OpenLEADR openleadr-rs"
    repository: "https://github.com/OpenLEADR/openleadr-rs"
    version: "v0.2.8"            # latest release (2026-10-30)
    revision: "d1523514e522b45b66d1d293ed208afb52e606ad"   # the commit of tag v0.2.8; the build fetches it
    license: "Apache-2.0 OR MIT"
    language: "Rust"
    independent_engine: true
    roles: [server]
    bundled:
      postgresql: "17 (Alpine 3.22 package postgresql17, PostgreSQL licence)"   # the VTN's database, inside the image
      argon2: "Alpine 3.22 package argon2 (CC0-1.0 OR Apache-2.0)"              # hashes the fixture's client secrets
      mosquitto: "2.0 (Alpine 3.22 package mosquitto, EPL-2.0 OR BSD-3-Clause)"  # the MQTT broker the VTN publishes to
    base_images:
      rust: "rust:1.94-alpine@sha256:77237dd363a0b127bb5ef532c2d64c0deb380b738e43a9c4bdac73398d6d0a08"
      alpine: "alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f"
    note: >-
      OpenLEADR has a client library too (openleadr-client); the adapter does
      not wrap it yet, so the image has no client role.

  elaadnl:
    priority: P0
    status: published            # ghcr.io/otfabric/openadr-interop-elaadnl
    upstream: "ElaadNL openadr3-client"
    repository: "https://github.com/ElaadNL/openadr3-client"
    artifact: "pypi:openadr3-client"
    version: "2.4.2"             # latest release
    revision: "134ff74e50a1865435ea8a9a15980bea418e0dac"   # tag 2.4.2; information, the build installs the wheel
    wheel_sha256: "f46d2dc21356c00ea74839aae3bd6f7e97e55bd6e991cdc7a0caab94d9e8dedf"
    license: "Apache-2.0"
    language: "Python"
    independent_engine: true
    roles: [client]
    lock: adapters/elaadnl/requirements.txt   # every dependency, with hashes
    base_images:
      python: "python:3.14.8-slim-trixie@sha256:fbecd461fc72d21b2143c6eaba25143738079154a6d0ea3da3aec724f50eed4a"

  openleadr301:
    priority: P1
    status: published            # ghcr.io/otfabric/openadr-interop-openleadr301
    upstream: "OpenLEADR openleadr-rs"
    repository: "https://github.com/OpenLEADR/openleadr-rs"
    version: "v0.1.4"            # the last release of OpenADR 3.0; v0.2 and later serve 3.1.0
    revision: "92f4ba12d34cee0458af5846f170996d0b31978f"   # the commit of tag v0.1.4; the build fetches it
    license: "Apache-2.0 OR MIT"
    language: "Rust"
    independent_engine: true     # an earlier engine than openleadr's, and of another revision
    openadr_versions: ["3.0.1"]
    roles: [server]
    bundled:
      postgresql: "17 (Alpine 3.22 package postgresql17, PostgreSQL licence)"   # the VTN's database, inside the image
      argon2: "Alpine 3.22 package argon2 (CC0-1.0 OR Apache-2.0)"              # hashes the fixture's client secrets
    base_images:
      rust: "rust:1.94-alpine@sha256:77237dd363a0b127bb5ef532c2d64c0deb380b738e43a9c4bdac73398d6d0a08"
      alpine: "alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f"
    note: >-
      Tracks v0.1.x only (scripts/latest-upstream.py). Not in the conformance
      suite, which is of 3.1.0.

  cbsigma:
    priority: P1
    status: implemented
    upstream: "cB-Sigma openadr"
    repository: "https://github.com/cB-Sigma/openadr"
    module: "github.com/cB-Sigma/openadr"
    version: "v0.2.1"            # latest release; tags only
    revision: "cc2be89330fba4ba6add4ce026e925ce4e659c6b"   # the commit of tag v0.2.1
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    openadr_versions: ["3.1.0"]
    roles: [server, client]
    lock: adapters/cbsigma/go.mod   # with go.sum; the module has no dependency the adapter links
    base_images:
      golang: "golang:1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e"
      debian: "debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"
    note: >-
      The VTN is oadr3/vtn, the clients oadr3.APIClient. Not wired: the VTN's
      MQTT notifier (it needs a broker client the application supplies),
      mDNS (oadr3/mdns) and OpenADR 3.0 (vtn.Version30).

# OT Fabric's own stacks. Not independent implementations, not in a release of
# this repository or its manifest.json: see own/<library>/README.md.
own_implementations:
  otfabric:
    upstream: "go-openadr"
    repository: "https://github.com/otfabric/go-openadr"
    artifact: "go:github.com/otfabric/go-openadr"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    openadr_versions: ["3.1.0"]
    roles: [server, client]
    image: "ghcr.io/otfabric/openadr-interop-otfabric"
    build: "own/go-openadr"
    base_images:
      golang: "golang:1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e"
      debian: "debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"
